---
- name: "Upload ipmi_exporter configure file"
  notify: "(Re)start and enable ipmi_exporter"
  ansible.builtin.template:
    src: "{{ ipmi_exp_source_dir }}/ipmi_local.conf"
    dest: "{{ ipmi_exp_config_dir }}/ipmi_local.conf"
    owner: root
    group: root
    mode: '0640'
  when: ipmi_local_config is defined and ipmi_local_config | length > 0
