---
- name: Converge
  hosts: all
  pre_tasks:
    - name: "install freeIPMI"
      ansible.builtin.apt:
        name:
          - freeipmi
        update_cache: true
        cache_valid_time: 3600
        autoremove: true
        autoclean: true

  roles:
    - role: genlab.ipmi_exporter
      ipmi_exp_version: "1.10.1"
      ipmi_exp_source_dir: "molecule/default/"
